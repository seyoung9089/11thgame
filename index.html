<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>번개 피하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 장난스럽고 긴장감 있는 학년 미니게임
   IDEA: 폭풍 치는 밤, 넓은 잔디밭 위로 번개가 떨어지는 오락실 게임기
   PICTURE: 잔디밭, 원형 예고 → 번개, 자유롭게 뛰어다니며 별을 줍는 캐릭터 10종
   COLOUR and TYPE: 폭풍 보라-먹색 바탕, 잔디 초록, 번개 노랑 / Black Han Sans + Noto Sans KR
   LAYOUT: 보드가 주인공, 오른쪽에 랭킹, 좁은 화면에서는 보드-방향키-랭킹 순 */
:root{color-scheme:dark;--bg:#16131f;--panel:#211c2e;--line:#3a3250;--ink:#f3efe6;--mute:#b3aac4;--bolt:#ffe94d}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#2d2442 0%,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px)}
header{margin-bottom:16px}
h1{font:400 clamp(32px,6vw,48px)/1.05 "Black Han Sans",sans-serif;margin:0}
h1 span{color:var(--bolt)}
.sub{color:var(--mute);margin:4px 0 0;font-size:15px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.machine{background:linear-gradient(#2a2339,#1b1727);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.hud div{background:#120f1a;border-radius:12px;padding:8px 12px;border:1px solid #2c2540}
.hud small{display:block;color:var(--mute);font-size:13px}
.hud b{font:400 26px/1.1 "Black Han Sans",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
#combo{color:var(--bolt)}
.board{position:relative;width:100%;max-width:600px;margin:0 auto;aspect-ratio:1}
.board canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;touch-action:none;display:block}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,11,20,.72);border-radius:14px;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{max-width:340px;text-align:center}
.card h2{font:400 34px/1.1 "Black Han Sans",sans-serif;margin:0 0 8px}
.card h2.big{font-size:52px;color:var(--bolt)}
.card p{margin:0 0 12px;color:#ddd5e8;font-size:15px}
.mine{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 14px}
.mine img{width:64px;height:64px;border-radius:16px;background:#2f4a2a;border:2px solid var(--bolt)}
.mine span{display:block;font-weight:700;text-align:left}
.mine button{background:#3b3352;color:var(--ink);font-weight:700;font-size:14px;min-height:40px;padding:0 14px;margin-top:4px}
.rules{text-align:left;margin:0 0 16px;padding:12px 14px;background:rgba(0,0,0,.35);border-radius:12px;font-size:14px;list-style:none}
.rules li{padding:2px 0}.rules b{color:var(--bolt)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--bolt);outline-offset:2px}
.go{background:var(--bolt);color:#1a1508;font-weight:900;font-size:18px;padding:0 28px;box-shadow:0 4px 0 #b39a12}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #b39a12}
.save{display:flex;gap:8px;margin:0 0 8px}
.save input{flex:1;font:inherit;font-size:16px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#120f1a;color:var(--ink);padding:0 12px}
.save button{background:#3b3352;color:var(--ink);font-weight:700}
.msg{font-size:14px;color:var(--bolt);min-height:1.5em;margin:0 0 10px}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;margin-top:14px;user-select:none;-webkit-user-select:none}
.pad button{background:#2f2843;color:var(--ink);font-size:22px;border:1px solid var(--line);touch-action:none}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .dashBtn{grid-column:3;grid-row:1;background:var(--bolt);color:#1a1508;font-size:15px;font-weight:900;border:0;white-space:nowrap;padding:0}
@media (pointer:coarse),(max-width:700px){.pad{display:grid}}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.rank h2{font:400 26px/1.1 "Black Han Sans",sans-serif;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;background:#16121f;color:var(--mute);font-size:14px;padding:0 8px;border:1px solid var(--line)}
.tabs button[aria-pressed=true]{background:var(--bolt);color:#1a1508;font-weight:700;border-color:var(--bolt)}
ol{list-style:none;margin:0;padding:0}
ol li{display:grid;grid-template-columns:28px 34px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #2e2840}
ol li img{width:34px;height:34px;border-radius:9px;background:#2f4a2a}
ol li .n{font:400 18px "Black Han Sans",sans-serif;color:var(--mute);text-align:center}
ol li:nth-child(1) .n{color:var(--bolt)}ol li:nth-child(2) .n{color:#d9d4e6}ol li:nth-child(3) .n{color:#e59b5f}
ol li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol li .sc{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
ol li.me{background:rgba(255,233,77,.1);border-radius:8px}
ol li.empty{display:block;color:var(--mute);font-size:14px;padding:12px 4px;border:0}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.keys{color:var(--mute);font-size:13px;text-align:center;margin:10px 0 0}
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,6,12,.75);padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheetHead h2{font:400 28px/1.1 "Black Han Sans",sans-serif;margin:0}
.sheetHead button{background:#16121f;color:var(--ink);width:44px;padding:0;font-size:18px}
.avgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.avgrid button{background:#16121f;border:2px solid var(--line);padding:8px 4px;display:grid;justify-items:center;gap:4px;color:var(--ink);font-size:13px;min-height:0}
.avgrid button img{width:100%;max-width:72px;aspect-ratio:1;border-radius:12px;background:#2f4a2a}
.avgrid button[aria-pressed=true]{border-color:var(--bolt);background:#2a2412}
.sheet .go{width:100%}

.view[hidden]{display:none}
.home{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px 16px 120px}
.sky{position:absolute;inset:0;width:100%;height:100%}
.sky .b1{animation:fl 3.2s infinite}.sky .b2{animation:fl 4.1s 1.3s infinite}
@keyframes fl{0%,86%,100%{opacity:0}88%,92%{opacity:1}90%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.sky path[class]{animation:none;opacity:.8}}
.homeIn{position:relative;text-align:center;width:min(420px,100%)}
.home h1{font-size:clamp(52px,12vw,84px)}
.home .sub{font-size:16px;margin:8px 0 24px}
.mine{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 24px;background:rgba(18,15,26,.75);border:1px solid var(--line);border-radius:18px;padding:12px 16px;width:fit-content}
.mine img{width:72px;height:72px;border-radius:16px;border:2px solid var(--bolt)}
.mine small{display:block;color:var(--mute);font-size:13px;text-align:left}
.mine span{display:block;font-weight:900;font-size:18px;text-align:left}
.mine button{background:#3b3352;color:var(--ink);font-weight:700;font-size:14px;min-height:40px;padding:0 14px;margin-top:6px}
.menu{display:grid;gap:12px;width:min(300px,100%);margin:0 auto}
.big{min-height:60px;font-size:22px;font-weight:900}
.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:2px solid var(--line);font-weight:700}
.best{color:var(--mute);font-size:14px;margin:16px 0 0;min-height:1.5em}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back{background:#2a2339;color:var(--ink);border:1px solid var(--line);font-weight:700}
h1.small{font-size:28px}
#game .machine{max-width:640px;margin:0 auto}
#rankView .rank{max-width:560px;margin:0 auto}
.ovBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wide{width:100%;margin-top:16px}
.gamev{height:100vh;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px}
#game .board{--padH:0px;width:min(calc(100vw - 16px),calc(100vh - 16px - var(--padH)));width:min(calc(100vw - 16px),calc(100dvh - 16px - var(--padH)));max-width:none;margin:0}
#game .pad{margin-top:0}
@media (pointer:coarse),(max-width:700px){#game .board{--padH:132px}}
body.ingame{overflow:hidden}
.ov{z-index:3}
.inb{position:absolute;left:10px;top:10px;z-index:2;min-height:36px;padding:0 12px;font-size:14px;background:rgba(18,15,26,.6);backdrop-filter:blur(2px)}
.tag{color:var(--bolt)!important;font-weight:900;margin:0 0 4px!important}
.nameRow{display:flex;align-items:center;gap:10px;width:min(300px,100%);margin:0 auto 6px}
.nameRow label{font-weight:700;white-space:nowrap}
.nameRow input{flex:1;font:inherit;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(18,15,26,.85);color:var(--ink);padding:0 12px;text-align:center}
#nameMsg{min-height:1.4em;margin:0 0 8px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,#ffcf2e 55%,#d99a00);box-shadow:inset 0 0 0 2px #b87f00;flex:none}
.wallet{display:inline-flex;align-items:center;gap:8px;background:rgba(18,15,26,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin:0 0 14px;font-size:15px}
.wallet b{font:400 20px/1 "Black Han Sans",sans-serif;color:#ffd54a;font-variant-numeric:tabular-nums}
.wallet.sm{margin:0 10px 0 auto}
.menu2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shopgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
@media(max-width:600px){.shopgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{background:#16121f;border:2px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;justify-items:center;gap:6px;color:var(--ink);min-height:0}
.item img{width:100%;max-width:96px;aspect-ratio:1;border-radius:12px}
.item .nm{font-weight:700;font-size:14px}
.item .st{font-size:13px;border-radius:999px;padding:4px 10px;background:#2f2843;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.item .st .coin{width:14px;height:14px}
.item.on{border-color:var(--bolt);background:#2a2412}
.item.on .st{background:var(--bolt);color:#1a1508;font-weight:900}
.item.arm .st{background:#ff7a3d;color:#fff;font-weight:900}
.item.poor .st{opacity:.6}
.item{position:relative}
.pvwrap{position:sticky;top:-20px;z-index:2;margin:12px -20px 0;padding:8px 20px;background:var(--panel)}
.pvwrap .pvlabel{left:30px;bottom:16px}
#pv{display:block;width:100%;aspect-ratio:2.2;border-radius:14px;background:#3a5a33}
.pvlabel{position:absolute;left:10px;bottom:8px;margin:0;font-size:13px;font-weight:700;background:rgba(18,15,26,.7);border-radius:999px;padding:4px 10px}
.item.pv{outline:2px dashed #5ef0ff;outline-offset:2px}
.item.leg{border-color:transparent;background:linear-gradient(#1d1728,#1d1728) padding-box,linear-gradient(120deg,#ff5ef0,#ffe94d,#5ef0ff,#b59cff,#ff5ef0) border-box;background-size:100% 100%,300% 300%;animation:legb 3s linear infinite}
.item.leg.on{background:linear-gradient(#2a2412,#2a2412) padding-box,linear-gradient(120deg,#ff5ef0,#ffe94d,#5ef0ff,#b59cff,#ff5ef0) border-box;background-size:100% 100%,300% 300%}
.legb{position:absolute;top:6px;left:6px;z-index:1;font-size:11px;font-weight:900;color:#1a1508;background:linear-gradient(90deg,#ffe94d,#ff9ff0);border-radius:999px;padding:2px 7px}
@keyframes legb{to{background-position:0 0,300% 0}}
ol li.leg img{outline:2px solid #ffe94d;box-shadow:0 0 12px rgba(255,200,80,.8)}
ol li .skin{display:block;font-size:11px;font-weight:700;background:linear-gradient(90deg,#ffe94d,#ff9ff0,#5ef0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-reduced-motion:reduce){.item.leg{animation:none}}
@media(max-width:480px){.shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.update{margin:14px auto 0;background:#2fb4a6;color:#08201d;font-weight:700;border-radius:14px;padding:8px 8px 8px 14px;display:inline-flex;align-items:center;gap:10px}
.update button{background:#08201d;color:#fff;min-height:36px;font-weight:700}
@media(max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hud b{font-size:22px}.machine{padding:10px;border-radius:18px}.avgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.card h2.big{font-size:42px}.rules{display:none}}
@media(max-width:380px){.avgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="view home" id="home">
  <svg class="sky" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><radialGradient id="cl" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#3a2f55"/><stop offset="1" stop-color="#16131f" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="200" cy="40" rx="260" ry="110" fill="url(#cl)"/>
    <g fill="#2a2240"><ellipse cx="70" cy="30" rx="70" ry="26"/><ellipse cx="130" cy="18" rx="60" ry="24"/><ellipse cx="290" cy="26" rx="80" ry="28"/><ellipse cx="360" cy="14" rx="60" ry="22"/></g>
    <path class="b1" d="M92 46 L78 92 L94 90 L80 140" fill="none" stroke="#ffe94d" stroke-width="3.5" stroke-linejoin="round"/>
    <path class="b2" d="M318 50 L334 96 L318 94 L332 150" fill="none" stroke="#ffe94d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 300 L0 250 Q100 232 200 246 Q300 260 400 240 L400 300Z" fill="#3a5a33"/>
    <path d="M0 300 L0 268 Q120 254 220 266 Q320 278 400 262 L400 300Z" fill="#4a6b3f"/>
  </svg>
  <div class="homeIn">
    <h1>번개 <span>피하기</span></h1>
    <p class="sub">잔디밭 위로 떨어지는 번개를 피해 별을 모으세요.</p>
    <div class="wallet"><i class="coin" aria-hidden="true"></i><b id="homeCoins">0</b><span>코인</span></div>
    <div class="mine">
      <img id="myAv" alt="">
      <div><small>내 캐릭터</small><span id="myAvName"></span><button type="button" id="pick">캐릭터 바꾸기</button></div>
    </div>
    <div class="nameRow">
      <label for="nm">닉네임</label>
      <input id="nm" maxlength="10" placeholder="랭킹에 표시될 이름" autocomplete="off">
    </div>
    <p class="msg" id="nameMsg"></p>
    <div class="menu">
      <button class="go big" type="button" id="homeStart">게임 시작</button>
      <div class="menu2"><button class="ghost big" type="button" id="homeShop">상점</button><button class="ghost big" type="button" id="homeRank">랭킹</button></div>
    </div>
    <p class="best" id="homeBest"></p>
  </div>
</main>

<main class="view gamev" id="game" hidden>
  <div class="stage">
    <div class="board" id="board">
      <canvas id="cv" aria-label="번개가 떨어지는 잔디밭"></canvas>
      <button type="button" class="back inb" data-home>← 홈</button>
      <div class="ov" id="ov" hidden>
        <div class="card">
          <p class="tag" id="ovTag"></p>
          <h2 id="ovT" class="big">0점</h2>
          <p id="ovP"></p>
          <p class="msg" id="saveMsg"></p>
          <div class="ovBtns"><button class="go" id="go" type="button">다시 하기</button><button class="ghost" type="button" data-home>홈으로</button></div>
        </div>
      </div>
    </div>
    <div class="pad" aria-label="방향 버튼">
      <button class="u" data-d="up" aria-label="위">▲</button>
      <button class="l" data-d="left" aria-label="왼쪽">◀</button>
      <button class="d" data-d="down" aria-label="아래">▼</button>
      <button class="r" data-d="right" aria-label="오른쪽">▶</button>
      <button class="dashBtn" id="dashBtn" type="button" aria-label="대쉬">대쉬</button>
    </div>
  </div>
</main>

<main class="view wrap" id="rankView" hidden>
  <div class="topbar"><button type="button" class="back" data-home>← 홈</button></div>
  <section class="rank" aria-label="랭킹">
    <h2>학년 랭킹</h2>
    <div class="tabs" id="rankTabs">
      <button type="button" data-t="all" aria-pressed="true">점수</button>
      <button type="button" data-t="time" aria-pressed="false">버틴 시간</button>
      <button type="button" data-t="me" aria-pressed="false">내 기록</button>
    </div>
    <ol id="list"></ol>
    <p class="note" id="note">랭킹을 불러오는 중입니다…</p>
    <button class="go wide" type="button" id="rankStart">나도 도전하기</button>
  </section>
</main>
<div class="modal" id="shop" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sheet">
    <div class="sheetHead"><h2 id="shT">상점</h2><div class="wallet sm"><i class="coin" aria-hidden="true"></i><b id="shopCoins">0</b></div><button type="button" id="shopX" aria-label="닫기">✕</button></div>
    <div class="tabs" id="shopTabs"><button type="button" data-s="hat" aria-pressed="true">모자</button><button type="button" data-s="fx" aria-pressed="false">달리기 이펙트</button></div>
    <div class="pvwrap"><canvas id="pv" aria-label="스킨 미리보기"></canvas><p class="pvlabel" id="pvLabel"></p></div>
    <div class="shopgrid" id="shopGrid"></div>
    <p class="msg" id="shopMsg">코인은 게임 중에 잔디밭에 나타나는 동전을 주워서 모읍니다.</p>
  </div>
</div>
<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pkT">
  <div class="sheet">
    <div class="sheetHead"><h2 id="pkT">캐릭터 고르기</h2><button type="button" id="pkX" aria-label="닫기">✕</button></div>
    <div class="avgrid" id="avgrid"></div>
    <button class="go" type="button" id="pkOk">이 캐릭터로 할래요</button>
  </div>
</div>
<script>
{
const SB='https://qdkvclpapsasedrvhkvx.supabase.co', SBKEY='sb_publishable_ceZ2sE7WKbkcod54qVl5aA_HR4bq4iQ';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), board=document.getElementById('board');
const $=id=>document.getElementById(id);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const SPD=.52, PR=.032;

  if(it.k==='hat')pvHat=it.id;else{pvFx=it.id;pvP=[]}pvStart();
  if(owns(it.id)){if(it.k==='hat'){hat=it.id;ls.set('bolt-hat',hat)}else{trail=it.id;ls.set('bolt-trail',trail)}$('shopMsg').textContent=`${it.n}을(를) 착용했습니다.`;armed=null;renderShop();syncSkin();return}
  if(wallet.coins<it.p){$('shopMsg').textContent=`${it.n}을(를) 미리보기로 보여 드려요. 사려면 코인이 ${it.p-wallet.coins}개 더 필요합니다.`;renderShop();return}
  if(armed!==it.id||performance.now()-armT>3000){armed=it.id;armT=performance.now();$('shopMsg').textContent=`${it.n} 미리보기 중 · ${it.p}코인에 사려면 한 번 더 누르세요.`;renderShop();return}
  armed=null;$('shopMsg').textContent='구매하는 중…';
  try{setWallet(await rpc('bolt_buy',{p_key:myKey,p_item:it.id}));if(it.k==='hat'){hat=it.id;ls.set('bolt-hat',hat)}else{trail=it.id;ls.set('bolt-trail',trail)}
    $('shopMsg').textContent=`${it.n} 구매 완료! 바로 착용했습니다.`;renderShop();syncSkin()}
  catch(err){$('shopMsg').textContent=/not enough/.test(err.message)?'코인이 부족합니다.':'상점 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';renderShop()}});
document.querySelectorAll('#shopTabs button').forEach(b=>b.addEventListener('click',()=>{shopTab=b.dataset.s;armed=null;document.querySelectorAll('#shopTabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderShop()}));
/* ---------- 상점 미리보기: 사기 전에 움직이는 모습으로 확인 ---------- */
let pvHat=hat,pvFx=trail,pvP=[],pvRun=false,pvT=0,pvEmit=0,pvPrev=0;
function pvName(){const a=(ITEMS.find(i=>i.id===pvHat)||{}).n,b=(ITEMS.find(i=>i.id===pvFx)||{}).n;return `미리보기 · ${a||'모자 없음'} + ${b||'기본 흙먼지'}`}
function pvLoop(now){if($('shop').hidden){pvRun=false;return}
  const cvp=$('pv'),d=devicePixelRatio||1,w=cvp.clientWidth,h=cvp.clientHeight;if(cvp.width!==Math.round(w*d)){cvp.width=Math.round(w*d);cvp.height=Math.round(h*d)}
  const c=cvp.getContext('2d');c.setTransform(d,0,0,d,0,0);const dt=Math.min(.05,(now-(pvPrev||now))/1000);pvPrev=now;pvT+=dt;
  const H=h/w,x=.5+.36*Math.sin(pvT*1.1),y=H*.55+H*.22*Math.sin(pvT*2.2),vx=Math.cos(pvT*1.1),R=w*.04;
  const g=c.createRadialGradient(w/2,h/2,10,w/2,h/2,w*.6);g.addColorStop(0,'#5f8a50');g.addColorStop(1,'#3a5a33');c.fillStyle=g;c.fillRect(0,0,w,h);
  pvEmit-=dt;if(pvEmit<=0){pvEmit=.035;if(pvFx==='dust'){if(Math.random()<.25)pvP.push({type:'smoke',x,y:y+R/w*.9,vx:0,vy:-.02,life:.35,max:.35,seed:0,hue:0})}else emitFx(x,y,pvFx,pvP,R/w)}
  const leg=LEG.has(pvFx)?1.35:1;
  for(const p of pvP){p.life-=dt;if(p.g)p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;drawFx(c,p,p.x*w,p.y*w,w*FX_SIZE*leg)}
  pvP=pvP.filter(p=>p.life>0);
  const px=x*w,py=y*w,hop=Math.abs(Math.sin(pvT*16))*R*.22;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(px,py+R*1.05,R*.85,R*.28,0,0,7);c.fill();
  c.save();c.translate(px,py-hop);c.rotate(vx*.12);aura(c,0,0,R,pvHat,pvFx);drawAvatar(c,avatar,0,0,R,Math.sign(vx)||1);if(pvHat!=='none')drawHat(c,pvHat,0,0,R,Math.sign(vx)||1);c.restore();
  requestAnimationFrame(pvLoop)}
function pvStart(){$('pvLabel').textContent=pvName();if(!pvRun){pvRun=true;pvPrev=0;requestAnimationFrame(pvLoop)}}
function openShop(){armed=null;pvHat=hat;pvFx=trail;pvP=[];$('shopMsg').textContent='아이템을 누르면 위에서 바로 미리보기됩니다. 코인은 게임 중 잔디밭의 동전을 주워 모읍니다.';renderShop();$('shop').hidden=false;pvStart();loadWallet()}
function closeShop(){$('shop').hidden=true;$('homeShop').focus()}
$('homeShop').addEventListener('click',openShop);$('shopX').addEventListener('click',closeShop);
$('shop').addEventListener('click',e=>{if(e.target.id==='shop')closeShop()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('shop').hidden)closeShop()});
paintWallet();loadWallet();
try{const p=JSON.parse(ls.get('bolt-coin-pend','null'));if(p&&p.c>0)finishGame(0,0)}catch(e){}
/* ---------- 새 버전 확인 (브라우저 캐시 때문에 옛 버전이 보이는 것 방지) ---------- */
const BUILD='2026-11-25-1100';
const freshUrl=()=>location.href.split('#')[0].split('?')[0]+'?v='+Date.now();
async function checkUpdate(){try{const h=await (await fetch(freshUrl(),{cache:'no-store'})).text();const m=h.match(/const BUILD='([^']+)'/);
  let seen=null;try{seen=sessionStorage.getItem('bolt-upd-'+(m&&m[1]))}catch(e){}
  if(m&&m[1]!==BUILD&&!seen&&state!=='play'&&!$('home').hidden){try{sessionStorage.setItem('bolt-upd-'+m[1],'1')}catch(e){}location.replace(freshUrl())}}catch(e){}}
checkUpdate();setInterval(()=>{if(state!=='play')checkUpdate()},60000);
render();homeBest();loadRank();setInterval(()=>{if(state!=='play'&&!document.hidden)loadRank()},20000);
function myName(){return ls.get('bolt-name','').slice(0,10)}
let lastSent=ls.get('bolt-sent-name','');
function setName(n){const changed=n!==myName();ls.set('bolt-name',n);
  const best=Number(ls.get('bolt-best','0'))||0;if(changed&&best>0&&n!==lastSent)submit(best,Number(ls.get('bolt-best-t','0'))||0,false)}
async function submit(score,time,show){
  const name=myName();if(!name)return;
  ls.set('bolt-pending',JSON.stringify({score,time}));
  if(show)$('saveMsg').textContent='랭킹에 등록하는 중…';
  try{
    const r=await fetch(`${SB}/rest/v1/rpc/bolt_submit_score`,{method:'POST',headers:{apikey:SBKEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_key:myKey,p_name:name,p_avatar:avatar,p_score:score,p_time:time,p_hat:hat,p_fx:trail})});
    if(!r.ok)throw new Error(r.status);
    const res=await r.json();myId=String(res.id||'');ls.set('bolt-id',myId);ls.set('bolt-pending','');lastSent=name;ls.set('bolt-sent-name',name);
    if(show)$('saveMsg').textContent=`랭킹 자동 등록! 점수 ${Number(res.rank)||'-'}등 · 버틴 시간 ${Number(res.time_rank)||'-'}등`;
    loadRank();
  }catch(e){if(show)$('saveMsg').textContent='랭킹 서버에 연결하지 못했습니다. 다음 접속 때 자동으로 다시 등록합니다.'}
}
$('nm').value=myName();
$('nm').addEventListener('change',()=>{const n=$('nm').value.trim();if(n&&!BAD.test(n)){$('nameMsg').textContent='';setName(n)}});
try{const p=JSON.parse(ls.get('bolt-pending','')||'null');if(p&&p.score>0)submit(p.score,p.time,false)}catch(e){}

}
</script>
